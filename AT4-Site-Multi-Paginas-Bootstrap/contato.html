<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viva+ | Contato</title>
    <link rel="shortcut icon" href="./img/svg-page.svg" type="image/x-icon">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/header.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <header>
    <nav class="row navbar nav-underline navbar-expand-lg bg-body-tertiary">
      <div class="col-8 m-3">
        <a class="navbar-brand" href="./index.html">Viva+</a>
      </div>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="col-4 collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="./index.html"
              >Inicio</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="./habitos.html">Hábitos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="./noticias.html">Notícias</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="./journey.html">Journey</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="./contato.html">Contato</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>
  <main>
    <section>
      <div class="div-formulario d-flex justify-content-center align-items-center container-fluid mt-3">
        <form class="m-2">
          <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label"
              >Seu Email</label
            >
            <input
              type="email"
              class="form-control"
              id="exampleInputEmail1"
              aria-describedby="emailHelp"
            />
            <div id="emailHelp" class="form-text">
              Nós não iremos compartilhar seu e-mail com ninguém
            </div>
          </div>
          <div class="mb-3">
            <label for="nome" class="form-label">Nome Completo</label>
            <input
              type="text"
              class="form-control"
              id="nome"
              name="nome"
              placeholder="Digite o seu nome"
            />
          </div>
          <div class="mb-3">
            <label for="descricao" class="form-label">Informe sua dúvida</label>
            <textarea
              class="form-control"
              id="descricao"
              name="descricao"
              rows="4"
              placeholder="Eu gostaria de saber...."
            ></textarea>
          </div>
          <button type="submit" class="btn btn-primary w-100">Enviar</button>
        </form>
      </div>
    </section>
  </main>
  <footer class="mt-5 d-flex align-items-center justify-content-center bg-secondary">
    <div>
      <p>&copy; Viva+, 2026 - TODOS OS DIREITOS RESERVADOS</p>
    </div>
  </footer>
  <body>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"

      crossorigin="anonymous"
    ></script>
  </body>
</html>
