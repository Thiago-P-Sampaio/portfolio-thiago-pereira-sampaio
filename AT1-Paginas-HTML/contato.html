<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leia+ | Contate-nos</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <h1>Editora Leia+</h1>
        <nav>
            <ol>
                <li><a href="./index.html">Livros</a></li>
                <li><a href="./sobre-nos.html">Sobre nós</a></li>
                <li><a href="./contato.html" class="active">Contate-nos</a></li>
                <li><a href="./autores.html">Autores</a></li>
                <li><a href="./blog.html">Blog</a></li>
            </ol>
        </nav>
    </header>

    <main class="container">
        <h1 class="page-title">Fale Conosco</h1>
        <div class="form-container">
            <form action="#" method="post">
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>
                <div class="form-group">
                    <label for="assunto">Assunto</label>
                    <select id="assunto" name="assunto">
                        <option value="duvidas">Dúvidas sobre pedidos</option>
                        <option value="originais">Envio de originais (Autores)</option>
                        <option value="comercial">Parcerias e Livreiros</option>
                        <option value="outro">Outro assunto</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Enviar Mensagem</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Editora Leia+. Todos os direitos reservados.</p>
        <p>Av. Paulista, 1000 - São Paulo, SP</p>
        <p>contato@editoraleiamais.com.br | (11) 4002-8922</p>
    </footer>
</body>
</html>
